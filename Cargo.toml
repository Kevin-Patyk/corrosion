[workspace]
resolver = "2"
members = ["stage0-vec-add", "stage1-matmul", "stage2-image-filters"]

[workspace.dependencies]
# Device side: what kernels can use (thread indexing, DisjointSlice, #[kernel]).
cuda-device = { git = "https://github.com/NVIDIA/cuda-rust", rev = "4ab9ab3e42" }
# Host side: loading the compiled kernels and launching them (#[cuda_module]).
cuda-host   = { git = "https://github.com/NVIDIA/cuda-rust", rev = "4ab9ab3e42" }
# Host-side CUDA runtime: context, stream, DeviceBuffer, LaunchConfig.
cuda-core = "0.3.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
